    <script>
        window_height = window.innerHeight

        let scroll_position = 0;
        scroll = document.documentElement
        window.addEventListener("scroll", function(e) {
            scroll_position = scroll.scrollTop

            if (scroll_position >= window_height - 100) {
                document.getElementById("arrow").style.transform = "rotate(180deg)"
                document.getElementById("arrow").style.transition = "all 0.3s ease-out"
                document.getElementById("arrow-link").href = "#"
            } else {
                document.getElementById("arrow").style.transform = "rotate(360deg)"
            }
